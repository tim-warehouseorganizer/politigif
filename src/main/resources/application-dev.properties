# Local development: readable assets, no asset caching, links in the log, media in a local folder.
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.cache-public=false

app.signin.secure-cookie=false
app.signin.log-links=true
app.storage.type=local
app.admin.emails=${APP_ADMIN_EMAILS:admin@politigif.local}
