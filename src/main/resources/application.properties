spring.application.name=politigif

# Port 8102 — next free in the family (see knowledge/commons.md, "Shared local infrastructure").
server.port=${PORT:8102}

spring.mongodb.uri=${MONGO_DB_URI:mongodb://root:testapppw@localhost:27019/politigif?authSource=admin}
spring.data.mongodb.auto-index-creation=true

spring.lifecycle.timeout-per-shutdown-phase=15s

# Behind Heroku's router: request.isSecure()/getRemoteAddr() reflect the visitor (HttpsRedirectFilter, RateLimiter).
server.forward-headers-strategy=framework

spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.cache.use-last-modified=true

server.compression.enabled=true
server.compression.mime-types=application/javascript,text/javascript,text/css,text/html,application/json,application/xml
server.compression.min-response-size=2048

# Uploads are a raw image/gif request body read by a fusio pipeline, never a multipart form.
spring.servlet.multipart.enabled=false
# When the GIF pipe trims at 7.77 s it stops reading; Tomcat swallows the unread rest of the body
# (up to this much) so the browser gets the response instead of a connection reset. Just above the
# 20 MB upload cap.
server.tomcat.max-swallow-size=21MB

# Where this instance is reached (links in sign-in mail) vs the public canonical host (og:, sitemap).
app.base-url=${APP_BASE_URL:http://localhost:8102}
app.canonical-base-url=${APP_CANONICAL_BASE_URL:https://www.politigif.com}

# ---- Redis-backed HTTP session (cookie POLITIGIFSESSION, keys politigif:session:*) ----
redis.session.url=${REDIS_URL_SESSION:redis://localhost:6379}
redis.session.password=${REDIS_SESSION_PASSWORD:testapppw}
app.redis.key-prefix=${REDIS_KEY_PREFIX:politigif}
app.session.idle-timeout=${APP_SESSION_IDLE_TIMEOUT:30d}

# ---- Mail: SMTP to Resend from the family sending subdomain (mail.politigif.com, no-reply@).
# MailService is a no-op until RESEND_API_KEY is set. ----
app.mail.host=${MAIL_HOST:smtp.resend.com}
app.mail.port=${MAIL_PORT:587}
app.mail.auth=true
app.mail.starttls-enabled=true
app.mail.username=${MAIL_USERNAME:resend}
app.mail.notification-email=${MAIL_FROM:no-reply@mail.politigif.com}
app.mail.notification-password=${RESEND_API_KEY:}

# ---- Sign-in links ----
app.signin.link-validity=${APP_SIGNIN_LINK_VALIDITY:15m}
# The browser-binding nonce cookie carries Secure. Off only in local dev over plain http.
app.signin.secure-cookie=${APP_SIGNIN_SECURE_COOKIE:true}
# Prints sign-in links to the log when mail is not configured. Local dev only: anyone who can read
# the log can take any account it prints.
app.signin.log-links=${APP_SIGNIN_LOG_LINKS:false}

# Admin accounts (report queue, delete any GIF), comma-separated emails. Checked at every sign-in.
app.admin.emails=${APP_ADMIN_EMAILS:}

# ---- Media ----
app.media.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
app.media.max-upload-bytes=20971520
# local (a folder, dev) or spaces (DigitalOcean Spaces, or any S3 bucket such as a Heroku Bucketeer
# attachment: each SPACES_* var falls back to the matching BUCKETEER_* var; a blank endpoint means AWS).
app.storage.type=${APP_STORAGE_TYPE:spaces}
app.storage.local-dir=${APP_STORAGE_LOCAL_DIR:./data/media}
app.storage.spaces.endpoint=${SPACES_ENDPOINT:}
app.storage.spaces.bucket=${SPACES_BUCKET:${BUCKETEER_BUCKET_NAME:}}
app.storage.spaces.key=${SPACES_KEY:${BUCKETEER_AWS_ACCESS_KEY_ID:}}
app.storage.spaces.secret=${SPACES_SECRET:${BUCKETEER_AWS_SECRET_ACCESS_KEY:}}
app.storage.spaces.region=${SPACES_REGION:${BUCKETEER_AWS_REGION:us-east-1}}
# Every object lives under this prefix, so a shared bucket stays partitioned per app.
app.storage.key-prefix=${APP_STORAGE_KEY_PREFIX:politigif/}

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

app.static.version=${APP_STATIC_VERSION:${HEROKU_RELEASE_VERSION:local}}
app.security.https-redirect.enabled=${APP_HTTPS_REDIRECT_ENABLED:true}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg - {"mdc": {"%replace(%replace(%X){'=', '":"'}){', ', '", "'}"}}%n

server.tomcat.threads.max=32
server.tomcat.threads.min-spare=2
